# Sized for a GitHub-hosted runner for private repos (2 vCPU / 7 GB RAM).
# Gradle daemon 3 GB + Kotlin daemon 1.5 GB + one test JVM 1.5 GB leaves room for the OS.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
# Do NOT set android.builtInKotlin, android.newDsl, android.disallowKotlinSourceSets or
# android.enableJetifier here: AGP 9 defaults are what we want (see docs/BYGGE.md).

# --- Screenshots (ci lane, Fas 1b; docs/BYGGE.md "Skärmbilder") ---
# false: `ciTest` RECORDS every Roborazzi screenshot (recordRoborazziDebug) and CI uploads them.
# true:  `ciTest` VERIFIES them against the committed goldens in <module>/src/test/screenshots/
#        (verifyRoborazziDebug). Only switch it on together with a fresh set of goldens from the
#        "Screenshots" workflow. Do not set roborazzi.test.* here: the convention plugin picks the task.
tandem.screenshots.verify=false

# --- detekt (ci lane, Fas 1b) ---
# Only the plain light-mode `detekt` task is used (tandem.detekt); no per-variant Android tasks.
detekt.android.disabled=true
