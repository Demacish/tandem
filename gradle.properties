# Sized for a GitHub-hosted runner for private repos (2 vCPU / 7 GB RAM).
# Gradle daemon 3 GB + Kotlin daemon 1.5 GB + one test JVM 1.5 GB leaves room for the OS.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
# Do NOT set android.builtInKotlin, android.newDsl, android.disallowKotlinSourceSets or
# android.enableJetifier here: AGP 9 defaults are what we want (see docs/BYGGE.md).

# --- Roborazzi (designsystem lane) ---
# Phase 0 records screenshots on every unit-test run in modules that apply
# tandem.android.roborazzi; CI uploads build/outputs/roborazzi as an artifact. Phase 1 switches
# to golden comparison (verifyRoborazziDebug) and removes this line.
roborazzi.test.record=true
