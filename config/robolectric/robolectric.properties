# Fas 5 (sdk37 lane): the SDK Robolectric runs the unit tests on by default (docs/BYGGE.md
# "Target SDK 37" -> CI). The apps target 37, but the tests stay on 36:
# - Compose ui-test 1.12 brings Espresso 3.5.0, whose event injection calls the hidden
#   InputManager.getInstance() that API 37 no longer has (NoSuchMethodException in every Compose test);
# - Roborazzi 1.76.0 cannot capture a View on API 37 (NoSuchMethodException);
# - every golden in src/test/screenshots was recorded on 36.
# Tests of Android 17 behavior ask for it themselves with @Config(sdk = [37]) (an annotation wins
# over this file). The convention plugin adds this directory to every Android module's unit-test
# resources (casa.moller.tandem.buildlogic.AndroidCommon).
sdk=36
