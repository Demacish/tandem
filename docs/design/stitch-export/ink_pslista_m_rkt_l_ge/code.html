<script>
  (function() {
    const form = document.getElementById('add-item-form');
    const input = document.getElementById('item-input');
    const pantryList = document.getElementById('pantry-list');
    const clearBtn = document.getElementById('clear-all-btn');
    const checkedContainer = document.getElementById('checked-container');
    const counterBadge = document.getElementById('counter-badge');
    const progressBar = document.getElementById('progress-bar');

    function updateStats() {
      const activeCheckboxes = document.querySelectorAll('input[type="checkbox"]');
      const totalActive = activeCheckboxes.length;
      const checkedActive = Array.from(activeCheckboxes).filter(cb => cb.checked).length;
      const staticChecked = checkedContainer ? checkedContainer.children.length : 0;
      
      const totalItems = totalActive + staticChecked;
      const totalDone = checkedActive + staticChecked;

      if (counterBadge && progressBar) {
        counterBadge.textContent = totalDone + ' av ' + totalItems + ' klara';
        const pct = totalItems > 0 ? Math.round((totalDone / totalItems) * 100) : 0;
        progressBar.style.width = pct + '%';
      }
    }

    if (form && input && pantryList) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const val = input.value.trim();
        if (!val) return;

        const label = document.createElement('label');
        label.className = 'group flex items-center justify-between p-2 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors cursor-pointer select-none';
        
        label.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <input type="checkbox" class="peer sr-only" data-name="${val}">
            <div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all peer-checked:bg-tertiary text-transparent peer-checked:text-on-tertiary">
              <span class="material-symbols-outlined text-[16px] leading-none" style="font-variation-settings: 'FILL' 1;">check</span>
            </div>
            <span class="text-sm font-medium font-body text-on-surface peer-checked:line-through peer-checked:text-on-surface-variant/60 truncate">${val}</span>
          </div>
          <span class="text-xs font-label text-on-surface-variant/90 pl-2 flex-shrink-0">1 st</span>
        `;

        const cb = label.querySelector('input');
        cb.addEventListener('change', updateStats);

        pantryList.appendChild(label);
        input.value = '';
        updateStats();
      });
    }

    document.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      cb.addEventListener('change', updateStats);
    });

    if (clearBtn && checkedContainer) {
      clearBtn.addEventListener('click', function() {
        checkedContainer.innerHTML = '<div class="py-2 text-center text-xs text-on-surface-variant/50 font-body">Inga avbockade varor kvar</div>';
        updateStats();
      });
    }
  })();
