name: Tandoor watch

# Nightly check of upstream Tandoor (plan 3.6 / 10, decision B18; docs/BYGGE.md
# "Tandoor-bevakning"): finds the vabene1111/recipes release tags on Docker Hub, runs the whole
# contract suite (contract.yml: Fas 0, Fas 1, the web scaling golden table) against a throwaway
# Tandoor for the 2.6.13 baseline, 2.6.15, the newest release of every line from 2.6 on and
# "latest", and compares every tag's observed facts with the baseline of the same run.
#
# A red run, a release that is newer than every version in TandoorVersionTable.TESTED, or a
# changed fact opens (or updates) ONE issue, "Tandoor watch: upstream needs attention"; a fully
# green night closes it again. Pushes that change the watch itself run everything but only write
# the job summary. No secrets: Docker Hub is read anonymously and the server lives in the runner.
on:
  schedule:
    - cron: "23 2 * * *" # nightly, 02:23 UTC (the slot contract.yml's nightly matrix used)
  workflow_dispatch:
    inputs:
      extra-tags:
        description: "Extra image tags to test, comma-separated (e.g. 2.6.14,2.7.0)"
        required: false
        default: ""
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/tandoor-watch.yml"
      - "contract-tests/watch/**"

concurrency:
  group: tandoor-watch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  discover:
    name: Find Tandoor releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.discover.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Releases on Docker Hub and the versions the app is tested against
        id: discover
        env:
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          python3 -I contract-tests/watch/discover.py \
            --version-table core/network/src/main/kotlin/casa/moller/tandem/core/network/capabilities/TandoorVersionTable.kt \
            --extra "${EXTRA_TAGS:-}" > discover.json
          cat discover.json
          echo "tags=$(python3 -I -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1]))["tags"]))' discover.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the discovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tandoor-watch-discover
          path: discover.json
          retention-days: 30

  contract:
    name: Contract suite
    needs: discover
    uses: ./.github/workflows/contract.yml
    with:
      tags: ${{ needs.discover.outputs.tags }}
    permissions:
      contents: read

  report:
    name: Report
    needs: [discover, contract]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The job list of this run (which tag passed), and the one watch issue.
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the discovery and the recordings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{tandoor-watch-discover,contract-recordings-*}"
          path: artifacts

      - name: Compare the observed facts and write the report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > jobs.json
          python3 -I contract-tests/watch/report.py \
            --discover artifacts/tandoor-watch-discover/discover.json \
            --jobs jobs.json \
            --recordings artifacts \
            --run-url "$RUN_URL" \
            --out report.md \
            --github-output "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the watch issue
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENTION: ${{ steps.report.outputs.attention }}
          FINGERPRINT: ${{ steps.report.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Tandoor watch: upstream needs attention"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --limit 20 \
            --json number,title,state --jq "[.[] | select(.title == \"$title\")] | sort_by(.number) | last // empty")"
          number="$(printf '%s' "$issue" | jq -r '.number // empty')"
          state="$(printf '%s' "$issue" | jq -r '.state // empty')"
          { cat report.md; echo; echo "<!-- fingerprint:${FINGERPRINT} -->"; } > body.md
          if [ "$ATTENTION" = "true" ]; then
            if [ -z "$number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
              exit 0
            fi
            previous="$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed -n 's/.*<!-- fingerprint:\([0-9a-f]*\) -->.*/\1/p')"
            [ "$state" = "CLOSED" ] && gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
            # A comment (and with it a notification) only when something new needs attention.
            if [ "$previous" != "$FINGERPRINT" ] || [ "$state" = "CLOSED" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Something changed since the last report: $RUN_URL"
            fi
          elif [ -n "$number" ] && [ "$state" = "OPEN" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "All green again, every release is tested: $RUN_URL"
          else
            echo "Nothing needs attention."
          fi
